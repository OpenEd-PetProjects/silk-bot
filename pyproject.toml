[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silk-bot"
version = "0.1.0"
description = "Telegram-бот заметок и напоминаний: FastAPI API + бот поверх API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "aiogram>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
silk-bot = "silk_bot.bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/silk_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
